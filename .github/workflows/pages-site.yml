name: Revenue Site Pages

on:
  workflow_dispatch:
  schedule:
    - cron: "22 14 * * *"

concurrency:
  group: pages-site
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ github.token }}
      TIP_URL: ${{ secrets.TIP_URL }}
      CLICK_REDIRECT_URL: ${{ secrets.CLICK_REDIRECT_URL }}
      SERVICE_INTAKE_URL: ${{ secrets.SERVICE_INTAKE_URL }}
      SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
      OFFER_PAYMENT_URLS: ${{ secrets.OFFER_PAYMENT_URLS }}
      KEYWORD_CSV_PATH: "data/revenue_keywords.csv"
      IDEA_CATALOG_PATH: "data/revenue_ideas.json"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Generate owned static site
        run: python -m farm_loop.main --portfolio-once --portfolio-phase generate --dry-run --max-opportunities 24 --site-output-dir out/site --microtool-output-dir out/site/tools --click-redirect-url "${CLICK_REDIRECT_URL}" --intake-url "${SERVICE_INTAKE_URL}" --site-base-url "${SITE_BASE_URL}" --offer-payment-urls "${OFFER_PAYMENT_URLS}"

      - name: Generate cron schedule pages (programmatic SEO)
        run: python -m farm_loop.main --build-cron-pages --cron-pages-output-dir out/site/cron --site-base-url "${SITE_BASE_URL}" --cron-tools-path "../tools/" --cron-offers-path "../offers/"

      - name: Generate pSEO clusters (emoji, colors, ports)
        run: python -m farm_loop.main --build-pseo-clusters --pseo-output-dir out/site --site-base-url "${SITE_BASE_URL}" --pseo-tools-path "../tools/" --pseo-offers-path "../offers/"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: out/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
