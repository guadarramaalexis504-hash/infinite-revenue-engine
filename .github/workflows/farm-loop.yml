name: Farm Loop

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "17 * * * *"
    - cron: "33 13 * * *"
    - cron: "47 13 * * 1"

concurrency:
  group: farm-loop-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  farm-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      STACKEXCHANGE_KEY: ${{ secrets.STACKEXCHANGE_KEY }}
      BUYMEACOFFEE_WEBHOOK_TOKEN: ${{ secrets.BUYMEACOFFEE_WEBHOOK_TOKEN }}
      TIP_URL: ${{ secrets.TIP_URL }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      GITHUB_TOKEN: ${{ github.token }}
      CLICK_REDIRECT_URL: ${{ secrets.CLICK_REDIRECT_URL }}
      SERVICE_INTAKE_URL: ${{ secrets.SERVICE_INTAKE_URL }}
      OFFER_PAYMENT_URLS: ${{ secrets.OFFER_PAYMENT_URLS }}
      LEAD_CAPTURE_URL: ${{ secrets.LEAD_CAPTURE_URL }}
      AFFILIATE_URLS: ${{ secrets.AFFILIATE_URLS }}
      SPONSOR_URLS: ${{ secrets.SPONSOR_URLS }}
      TARGET_USD: "15"
      REVENUE_MILESTONES: "15,200,1000,20000"
      STOP_AFTER_TARGET: "false"
      MAX_DRAFTS_PER_RUN: "3"
      KEYWORD_CSV_PATH: "data/revenue_keywords.csv"
      IDEA_CATALOG_PATH: "data/revenue_ideas.json"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run farm loop once
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/5 * * * *'
        run: python -m farm_loop.main --portfolio-once --portfolio-phase discover --max-opportunities 10

      - name: Generate top assets
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 * * * *'
        run: python -m farm_loop.main --portfolio-once --portfolio-phase generate --max-opportunities 10

      - name: Summarize revenue portfolio
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '33 13 * * *'
        run: python -m farm_loop.main --portfolio-once --portfolio-phase summarize

      - name: Prune low-performing loops
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '47 13 * * 1'
        run: python -m farm_loop.main --portfolio-once --portfolio-phase prune
